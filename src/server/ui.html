<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RustClaw</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --dim: #6b6b6b; --line: #e3e3e3;
    --user: #f2f4f7; --tool: #f7f7f5; --err: #b42318; --accent: #b7410e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #e8e6e3; --dim: #9a9a9a; --line: #2c2c33;
      --user: #22222a; --tool: #1c1c22; --err: #f97066; --accent: #e07a3f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: baseline; gap: .6rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--line); flex: none;
  }
  header b { color: var(--accent); }
  header span { color: var(--dim); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { max-width: 62rem; margin: 0 auto 1rem; }
  .user { background: var(--user); padding: .6rem .8rem; border-radius: .5rem; white-space: pre-wrap; }
  .assistant { white-space: pre-wrap; }
  .tool {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); background: var(--tool);
    border-left: 2px solid var(--line); padding: .35rem .6rem;
    margin: .35rem 0; overflow-x: auto; white-space: pre;
  }
  .tool.err { color: var(--err); border-left-color: var(--err); }
  .meta { color: var(--dim); font-size: 12px; }
  form { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid var(--line); flex: none; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: .55rem .7rem;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: .5rem; min-height: 2.6rem; max-height: 12rem;
  }
  button {
    font: inherit; padding: .55rem 1.1rem; border: 0; border-radius: .5rem;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  .cursor::after { content: "▍"; color: var(--dim); }
</style>

<header><b>RustClaw</b> <span id="status">connecting…</span></header>
<div id="log"></div>
<form id="f">
  <textarea id="i" placeholder="Message… (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
  <button id="send">Send</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('i');
const send = document.getElementById('send');
const status = document.getElementById('status');
let current = null;

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
function scroll(force) { if (force || atBottom()) log.scrollTop = log.scrollHeight; }

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text ?? '';
  log.appendChild(d);
  scroll(true);
  return d;
}

// The server is the source of truth for assistant output: everything below
// renders events off the SSE stream rather than the POST response.
const es = new EventSource('/events');
es.onopen = () => status.textContent = 'connected';
es.onerror = () => status.textContent = 'reconnecting…';

es.addEventListener('turn_start', () => {
  current = add('assistant cursor', '');
});

es.addEventListener('delta', e => {
  if (!current) current = add('assistant cursor', '');
  current.textContent += JSON.parse(e.data);
  scroll(false);
});

es.addEventListener('tool_start', e => {
  const { name, input } = JSON.parse(e.data);
  const d = document.createElement('div');
  d.className = 'msg tool';
  d.textContent = '⚙ ' + name + ' ' + input;
  log.appendChild(d);
  // The next delta belongs to a new paragraph, after the tool ran.
  current = null;
  scroll(false);
});

es.addEventListener('tool_end', e => {
  const { name, isError, preview } = JSON.parse(e.data);
  const d = document.createElement('div');
  d.className = 'msg tool' + (isError ? ' err' : '');
  d.textContent = (isError ? '✗ ' : '✓ ') + name + ': ' + preview.replace(/\n/g, ' ');
  log.appendChild(d);
  scroll(false);
});

es.addEventListener('compacted', e => {
  add('msg meta', 'ⓘ context compacted (' + JSON.parse(e.data).dropped + ' messages summarized)');
});

es.addEventListener('error', e => {
  if (!e.data) return;              // transport-level error, not an agent one
  add('msg tool err', '✗ ' + JSON.parse(e.data));
  current = null;
});

es.addEventListener('turn_end', e => {
  const u = JSON.parse(e.data);
  if (current) current.classList.remove('cursor');
  current = null;
  if (u.input || u.output) {
    add('msg meta', u.input + ' in / ' + u.output + ' out' +
      (u.cacheRead ? ' / ' + u.cacheRead + ' cached' : ''));
  }
  busy(false);
});

function busy(on) {
  send.disabled = on;
  send.textContent = on ? '…' : 'Send';
  input.disabled = on;
  if (!on) input.focus();
}

form.onsubmit = async ev => {
  ev.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;
  add('user', message);
  input.value = '';
  input.style.height = 'auto';
  busy(true);
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message })
    });
    if (!r.ok) {
      add('msg tool err', '✗ ' + r.status + ' ' + await r.text());
      busy(false);
    }
    // On success the stream has already rendered the reply; turn_end
    // re-enables the form.
  } catch (e) {
    add('msg tool err', '✗ ' + e);
    busy(false);
  }
};

input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
};
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 192) + 'px';
};
</script>
